<article class="card device-card shadow-sm mb-3">
    <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
            <h2 class="h5 card-title">
                <a href="{% url 'equipment:device_detail' device.id %}">{{ device.name|default:"Без названия" }}</a>
            </h2>
            {% include "equipment/includes/device_condition.html" with condition=device.condition only %}
        </div>
        <p class="card-text text-secondary mb-0">
            {{ device.device_type }} ·
            <a href="{% url 'rooms:room_detail' device.room.id %}">{{ device.room.name|default:"Без названия" }}</a>
        </p>
    </div>
</article>
