{% extends "base.html" %}
{% block title %}{{ heading }} · Учёт техники{% endblock %}
{% block content %}
    <h1 class="mb-3">{{ heading }}</h1>
    <form method="post" class="card card-body" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=form only %}
        <div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            {% if device %}
                <a href="{% url 'equipment:device_detail' device.id %}" class="btn btn-outline-secondary">Отмена</a>
            {% else %}
                <a href="{% url 'equipment:device_list' %}" class="btn btn-outline-secondary">Отмена</a>
            {% endif %}
        </div>
    </form>
{% endblock %}
