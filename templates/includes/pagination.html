{% if page_obj.has_other_pages %}
    <nav aria-label="Страницы устройств" class="mt-4">
        <ul class="pagination flex-wrap">
            {% if page_obj.has_previous %}
                <li class="page-item"><a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page=1">Первая</a></li>
                <li class="page-item"><a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a></li>
            {% endif %}
            <li class="page-item active"><span class="page-link" aria-current="page">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
            {% if page_obj.has_next %}
                <li class="page-item"><a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Вперёд</a></li>
                <li class="page-item"><a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.paginator.num_pages }}">Последняя</a></li>
            {% endif %}
        </ul>
    </nav>
{% endif %}
